[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The realization route must resolve as a function, not fall through to the
# SPA catch-all below. Without this the browser gets index.html with a 200 and
# reads it as a service answer.
[[redirects]]
  from = "/api/e05"
  to = "/.netlify/functions/e05"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/models/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/samples/*"
  [headers.values]
    Content-Type = "audio/wav"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Content-Type = "audio/wav"
    Cache-Control = "public, max-age=31536000, immutable"
