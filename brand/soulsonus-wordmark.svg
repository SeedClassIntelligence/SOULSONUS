<svg xmlns="http://www.w3.org/2000/svg" width="700" height="170" viewBox="0 0 700 170" role="img" aria-label="SOULSONUS">
  <title>SoulSonus wordmark</title>
  <defs>
    <linearGradient id="wordEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fcd34d"/>
