name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The build does not typecheck. Two crash-class errors have shipped green
      # past it and white-screened the studio at runtime, so this gate is the
      # one that actually catches them.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
