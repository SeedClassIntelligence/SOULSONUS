# Cloudflare Workers config for SoulSonus.
#
# This is a Workers project (Workers Builds, `npx wrangler deploy`) -- not
# Pages. main is the Worker entry point; [assets] tells the Worker runtime
# to serve dist/ as static files for anything worker/index.ts doesn't
# handle itself. See worker/index.ts for the one route it does handle.
#
# ACE_STEP_ENDPOINT and ACE_STEP_API_KEY are not set here -- configure them
# as encrypted secrets instead: dashboard Settings > Variables and Secrets,
# or `npx wrangler secret put ACE_STEP_API_KEY`. Nothing server-side should
# be committed to this file.
name = "soulsonus"
main = "worker/index.ts"
compatibility_date = "2026-08-21"

[assets]
directory = "dist"
binding = "ASSETS"

[build]
command = "bun run build"
